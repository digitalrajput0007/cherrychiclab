; CherryChic Beauty & Fragrance Lab
; Optimized PHP-FPM Pool Configuration for 1GB RAM Ubuntu VPS
; Place at: /etc/php/8.2/fpm/pool.d/cherrychic.conf

[cherrychic]
user = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager: Dynamic tuning to never exceed 350MB total PHP memory
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 1000

; Memory & Execution limits per worker
php_admin_value[memory_limit] = 64M
php_admin_value[max_execution_time] = 15
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 4M

; Security & Error Logging
php_admin_value[display_errors] = 'off'
php_admin_value[log_errors] = 'on'
php_admin_value[error_log] = /var/log/php/cherrychic_error.log
php_admin_value[open_basedir] = /var/www/cherrychic:/tmp:/var/log/php

