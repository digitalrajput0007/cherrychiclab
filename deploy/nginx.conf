# CherryChic Beauty & Fragrance Lab (cherrychic.in)
# Nginx Configuration optimized for 1GB RAM Ubuntu VPS (PHP 8.x-FPM + SQLite WAL)

# Rate limiting zone for affiliate redirector and requests to prevent scraper abuse
limit_req_zone $binary_remote_addr zone=cherrychic_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=cherrychic_api:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cherrychic.in www.cherrychic.in;

    # Redirect HTTP to HTTPS
    return 301 https://cherrychic.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cherrychic.in;

    # SSL certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/cherrychic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cherrychic.in/privkey.pem;

    # Canonical redirect www to non-www
    return 301 https://cherrychic.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cherrychic.in;

    # SSL certificates (Certbot)
    ssl_certificate /etc/letsencrypt/live/cherrychic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cherrychic.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/cherrychic/public;
    index index.php;

    charset utf-8;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Gzip Compression for minimal bandwidth
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting on interactive search & tools
    limit_req zone=cherrychic_req burst=30 nodelay;

    # Front-Controller Router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Dedicated Affiliate Redirect Handler (/buy.php)
    location = /buy.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index buy.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffering off;
        fastcgi_read_timeout 10s;
    }

    # API endpoints (Rate limited)
    location ^~ /api/ {
        limit_req zone=cherrychic_api burst=10 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Sitemap XML - Cache for 24h
    location = /sitemap.xml {
        expires 24h;
        add_header Cache-Control "public, no-transform";
        try_files $uri /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_busy_buffers_size 32k;
        fastcgi_intercept_errors off;
    }

    # Block access to hidden files and database directory
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(data|scripts|src|views)/ {
        deny all;
        return 404;
    }

    # Static Assets (Images, Icons, Fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Clean Error Pages without infinite internal redirect loops
    error_page 404 /index.php;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /var/www/cherrychic/public;
        internal;
    }

    access_log /var/log/nginx/cherrychic_access.log;
    error_log /var/log/nginx/cherrychic_error.log warn;
}

