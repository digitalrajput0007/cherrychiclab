<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Rich Velvet Cherry Gradient -->
    <linearGradient id="cherryLeft" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#FF5376"/>
      <stop offset="28%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#9E1B32"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <linearGradient id="cherryRight" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="35%" stop-color="#BE123C"/>
      <stop offset="75%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#3B0715"/>
    </linearGradient>
    <!-- Rose Gold Botanical Stem -->
    <linearGradient id="stemGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9E1B32"/>
    </linearGradient>
    <!-- Editorial Botanical Leaf -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <!-- Soft Specular Reflection -->
    <linearGradient id="specularGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Laboratory Clarity Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Ambient Depth Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#881337" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Shadows under Cherries -->
  <ellipse cx="37" cy="85" rx="14" ry="4" fill="#141413" opacity="0.12"/>
  <ellipse cx="65" cy="80" rx="13" ry="3.8" fill="#141413" opacity="0.1"/>

  <!-- Stems (Graceful botanical curves) -->
  <path d="M 52 17 C 43 25, 36 34, 37 50" fill="none" stroke="url(#stemGold)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 52 17 C 58 23, 64 32, 65 44" fill="none" stroke="url(#stemGold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Editorial Leaf (Fresh Botanical Form) -->
  <path d="M 52 17 C 58 8, 73 8, 78 14 C 72 23, 58 23, 52 17 Z" fill="url(#leafGrad)"/>
  <path d="M 53 17 C 60 15, 68 14, 75 15" fill="none" stroke="#FFFFFF" stroke-width="0.9" opacity="0.6" stroke-linecap="round"/>

  <!-- Main Cherry Forms with Filter Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- Right Cherry (Nestled Behind) -->
    <path d="M 65 44 C 70 41, 82 45, 82 58 C 82 70, 74 77, 65 77 C 56 77, 48 70, 48 58 C 48 45, 60 41, 65 44 Z" fill="url(#cherryRight)"/>
    <!-- Right Cherry Specular Glass Reflections -->
    <ellipse cx="57" cy="53" rx="4.5" ry="7.5" transform="rotate(-32 57 53)" fill="url(#specularGlow)"/>
    <circle cx="54" cy="49" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Left Cherry (Hero Foreground) -->
    <path d="M 37 49 C 42 46, 54 50, 54 64 C 54 75, 46 83, 37 83 C 27 83, 19 75, 19 64 C 19 50, 32 46, 37 49 Z" fill="url(#cherryLeft)"/>
    <!-- Left Cherry Specular Glass Reflections -->
    <ellipse cx="29" cy="58" rx="5" ry="8.5" transform="rotate(-32 29 58)" fill="url(#specularGlow)"/>
    <circle cx="26" cy="53" r="2.2" fill="#FFFFFF" opacity="0.95"/>
    <ellipse cx="43" cy="73" rx="4" ry="1.5" transform="rotate(-15 43 73)" fill="#FF8BA7" opacity="0.35"/>
  </g>

  <!-- Stem Junction Node -->
  <circle cx="52" cy="17" r="2" fill="#F59E0B"/>

  <!-- Clinical Formulation Starburst / Purity Sparkle -->
  <g filter="url(#starGlow)">
    <path d="M 85 24 Q 85 30 79 30 Q 85 30 85 36 Q 85 30 91 30 Q 85 30 85 24 Z" fill="#F59E0B"/>
    <circle cx="85" cy="30" r="1" fill="#FFFFFF"/>
    <!-- Micro secondary sparkle -->
    <path d="M 20 38 Q 20 41 17 41 Q 20 41 20 44 Q 20 41 23 41 Q 20 41 20 38 Z" fill="#FDA4AF" opacity="0.8"/>
  </g>
</svg>
