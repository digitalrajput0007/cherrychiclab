    <path d="M 52 17 C 43 25, 36 34, 37 50" fill="none" stroke="url(#stemGoldFull)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 52 17 C 58 23, 64 32, 65 44" fill="none" stroke="url(#stemGoldFull)" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M 52 17 C 58 8, 73 8, 78 14 C 72 23, 58 23, 52 17 Z" fill="url(#leafGradFull)"/>
    <!-- Cherries -->
    <path d="M 65 44 C 70 41, 82 45, 82 58 C 82 70, 74 77, 65 77 C 56 77, 48 70, 48 58 C 48 45, 60 41, 65 44 Z" fill="url(#chRightFull)"/>
    <ellipse cx="57" cy="53" rx="4.5" ry="7.5" transform="rotate(-32 57 53)" fill="url(#specularGlowFull)"/>
    <circle cx="54" cy="49" r="1.8" fill="#FFFFFF" opacity="0.9"/>
    
    <path d="M 37 49 C 42 46, 54 50, 54 64 C 54 75, 46 83, 37 83 C 27 83, 19 75, 19 64 C 19 50, 32 46, 37 49 Z" fill="url(#chLeftFull)"/>
    <ellipse cx="29" cy="58" rx="5" ry="8.5" transform="rotate(-32 29 58)" fill="url(#specularGlowFull)"/>
    <circle cx="26" cy="53" r="2.2" fill="#FFFFFF" opacity="0.95"/>
    <!-- Sparkle -->
    <path d="M 85 24 Q 85 30 79 30 Q 85 30 85 36 Q 85 30 91 30 Q 85 30 85 24 Z" fill="#F59E0B"/>
