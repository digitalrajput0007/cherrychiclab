  <!-- Typography -->
  <text x="54" y="32" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#0F172A">CHERRYCHIC</text>
  <rect x="202" y="18" width="46" height="17" rx="8.5" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
  <text x="225" y="30" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" letter-spacing="1" fill="#BE123C" text-anchor="middle">LAB™</text>
  <text x="55" y="44" font-family="'JetBrains Mono', monospace" font-size="6.5" font-weight="600" letter-spacing="1.5" fill="#64748B">FORMULATION &amp; FRAGRANCE INDEX</text>
