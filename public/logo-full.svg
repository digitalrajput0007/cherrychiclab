<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" fill="none">
  <defs>
    <linearGradient id="chLeftFull" x1="18%" y1="12%" x2="82%" y2="88%">
      <stop offset="0%" stop-color="#FF5376"/>
      <stop offset="28%" stop-color="#E11D48"/>
      <stop offset="70%" stop-color="#9E1B32"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>
    <linearGradient id="chRightFull" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="35%" stop-color="#BE123C"/>
      <stop offset="75%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#3B0715"/>
    </linearGradient>
    <linearGradient id="stemGoldFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9E1B32"/>
    </linearGradient>
    <linearGradient id="leafGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
