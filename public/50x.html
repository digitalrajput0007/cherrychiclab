<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Recalibrating | CherryChic Lab</title>
    <meta http-equiv="refresh" content="5">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FAF8F5;
            color: #141413;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border: 1px solid #E8E3DC;
            border-radius: 24px;
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px -12px rgba(20, 20, 19, 0.08);
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9E1B32;
            background: #FFF1F2;
            border: 1px solid #FECDD3;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        p {
            font-size: 14px;
            color: #5C5852;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #F3EFEA;
            border-top: 3px solid #E11D48;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #E11D48, #BE123C);
            color: #FFFFFF;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 9999px;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <div class="badge">CherryChic Lab · Live Synchronization</div>
        <h1>System Recalibrating</h1>
        <p>Our formulation database is momentarily synchronizing live INCI benchmarks. This page will automatically refresh in 5 seconds.</p>
        <a href="/" class="btn" onclick="location.reload(); return false;">Refresh Now</a>
    </div>
</body>
</html>
